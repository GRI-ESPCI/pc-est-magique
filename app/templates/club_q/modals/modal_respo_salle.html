{% if is_admin and respo_season %}
<div class="modal fade" id="mo-respo-salle" tabindex="-1" aria-labelledby="mo-respo-salle-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-4 shadow-lg">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="mo-respo-salle-label">{{ _("Désigner les respos salle") }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ _('Fermer') }}"></button>
      </div>
      <form id="form-respo-salle" action="" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="season_id" id="respo-season-id" value="{{ respo_season.id }}">
        <input type="hidden" name="return_to" value="{{ view }}">
        <input type="hidden" name="return_season_id" id="respo-return-season-id" value="{{ season_id if season_id is not none else '' }}">
        <div class="modal-body">
          <p class="small text-body-secondary mb-3" id="respo-salle-context"></p>
          <search class="mb-2">
            <label for="respo-pceen-search" class="form-label small fw-semibold">{{ _("Rechercher un PCéen") }}</label>
            <input
              type="search"
              id="respo-pceen-search"
              class="form-control"
              placeholder="{{ _('Nom, prénom ou promo…') }}"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="none"
              spellcheck="false"
            >
          </search>
          <fieldset class="mb-0">
            <div class="d-flex align-items-center justify-content-between mb-1">
              <legend class="form-label small fw-semibold mb-0 float-none w-auto p-0">{{ _("Respo(s) salle") }}</legend>
              <button type="button" id="respo-clear-btn" class="btn btn-sm btn-link text-danger text-decoration-none p-0">{{ _("Tout décocher") }}</button>
            </div>
            <div id="respo-pceen-list" class="border rounded-3 p-2 overflow-auto" style="max-height: 15rem">
              {% for p in eligible_pceens %}
              <div class="form-check py-1" data-search="{{ p.full_name }} {{ p.nom }} {{ p.prenom }} {{ p.promo or '' }}">
                <input class="form-check-input" type="checkbox" name="pceen_ids" value="{{ p.id }}" id="respo-pceen-{{ p.id }}">
                <label class="form-check-label" for="respo-pceen-{{ p.id }}">
                  {{ p.nom|upper }} {{ p.prenom }}{% if p.promo %} ({{ p.promo }}){% endif %}
                </label>
              </div>
              {% endfor %}
            </div>
          </fieldset>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ _("Annuler") }}</button>
          <button type="submit" class="btn btn-primary fw-semibold">{{ _("Enregistrer") }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endif %}
